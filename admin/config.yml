backend:
  name: github
  repo: sheeeetux11/star-weave-astrology
  branch: main

media_folder: "public/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "blog"
    label: "Blog Articles"
    folder: "content/blogs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Transits", "Natal", "Horoscopes", "Esoteric"] }
      - { label: "Tags", name: "tags", widget: "list", default: ["Astrology"] }
      - { label: "Featured Video ID", name: "youtubeId", widget: "string", required: false }
      - { label: "Body Reading Column", name: "body", widget: "markdown" }
