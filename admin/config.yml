backend:
  name: git-gateway
  branch: main # Change to 'master' if your main branch is named master

media_folder: "public/assets" # Where uploaded images will be saved
public_folder: "/assets"

collections:
  - name: "blogs"
    label: "Blogs"
    folder: "content/blogs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
